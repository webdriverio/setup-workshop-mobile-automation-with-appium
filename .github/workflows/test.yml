name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every system should finish well within this, a hanging test must not block the pull request for hours
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      # Shows the plan of the setup on this OS without changing anything on the machine
      - name: Setup in dry run
        run: npm run setup -- --yes --dry-run
